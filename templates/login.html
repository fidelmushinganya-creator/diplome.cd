<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Administration - DIPLÔME.CD</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="center-page">

<div class="login-box">

    <div class="logo">
        DIPLÔME<span>.CD</span>
    </div>

    <p class="small-title">
        ESPACE ADMINISTRATEUR
    </p>

    <h1>
        Connexion
    </h1>

    {% with messages = get_flashed_messages() %}

        {% if messages %}

            {% for message in messages %}

                <div class="alert">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <form method="POST">

        <label>
            Nom d'utilisateur
        </label>

        <input
            type="text"
            name="username"
            placeholder="Votre identifiant"
            required
        >


        <label>
            Mot de passe
        </label>

        <input
            type="password"
            name="password"
            placeholder="Votre mot de passe"
            required
        >


        <button
            type="submit"
            class="btn primary full">
            Se connecter
        </button>

    </form>


    <a href="{{ url_for('index') }}"
       class="back-link">
        ← Retour au site
    </a>

</div>

</body>
</html>
